<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-RideSafe Expo QR</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #071b2c; color: #eefcff; }
    main { text-align: center; background: #102b40; border: 1px solid #2d5870; border-radius: 24px; padding: 28px; max-width: 360px; }
    img { background: white; padding: 14px; border-radius: 12px; max-width: 100%; }
    code { color: #9cf5ed; overflow-wrap: anywhere; }
    p { line-height: 1.5; color: #c5d9e4; }
  </style>
</head>
<body>
  <main>
    <h1>E-RideSafe</h1>
    <p>Scan with Expo Go while your phone and computer are on the same Wi-Fi.</p>
    <img src="expo-qr.png" alt="Expo QR code" />
    <p><code>exp://192.168.0.211:8081</code></p>
  </main>
</body>
</html>
